<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Reserve – Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="home.html" class="brand">🍽 The Reserve</a>
    <div class="nav-links">
      <a href="home.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="menu.html" class="nav-link">Menu</a>
      <a href="reserve.html" class="nav-link">Reserve</a>
      <a href="datetime.html" class="nav-link">🕐 Time</a>
      <a href="login.html" class="nav-link" id="nav-login">Login</a>
      <a href="register.html" class="nav-link active" id="nav-register">Register</a>
      <span class="nav-link" id="nav-user-name" style="display:none;color:#fde68a"></span>
      <button class="btn btn-sm" id="nav-logout" style="display:none" onclick="clearUser();location.reload()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-icon">✨</span>
        <h1>Create Account</h1>
        <p>Join us and start booking your table</p>
      </div>

      <form id="register-form">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Jane Smith" required />
          </div>
          <div class="form-group">
            <label>Phone (optional)</label>
            <input type="tel" id="phone" placeholder="+1 555 000 0000" />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat password" required />
          </div>
        </div>
        <div id="message"></div>
        <button type="submit" class="btn btn-full">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 The Reserve</p>
  </footer>

  <script src="app.js"></script>
  <script>
    updateNavAuth();
    if (getUser()) window.location.href = 'home.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) return showMessage('Passwords do not match.', 'error');
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password
      };
      try {
        const res = await apiFetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) return showMessage(data.error, 'error');
        setUser(data);
        window.location.href = 'reserve.html';
      } catch { showMessage('Server error. Please try again.', 'error'); }
    });
  </script>
</body>
</html>
